name: nurse_assistant
description: تطبيق مساعد الممرض - للممرضين فقط مع نظام اشتراكات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.15.5
  # State & UI
  flutter_riverpod: ^2.4.9
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  # Notifications - مؤقت المحاليل
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2
  # PDF & Sharing
  pdf: ^3.10.7
  printing: ^5.11.1
  share_plus: ^7.2.1
  url_launcher: ^6.2.2
  path_provider: ^2.1.2
  # Network
  http: ^1.1.2
  dio: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
